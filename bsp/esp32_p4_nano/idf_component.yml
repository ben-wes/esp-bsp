version: "1.0.0"
description: Board Support Package (BSP) for Waveshare ESP32-P4-NANO
url: https://github.com/espressif/esp-bsp/tree/master/bsp/esp32_p4_nano

targets:
  - esp32p4

tags:
  - bsp
  - Waveshare

dependencies:
  idf: ">=5.4"

  esp_codec_dev:
    version: "~1.5"
    public: true

  espressif/esp_lvgl_port:
    version: "^2"
    public: true
    override_path: "../../components/esp_lvgl_port"

  esp_lcd_touch_gt911:
    version: "*"
    public: false
    override_path: "../../components/lcd_touch/esp_lcd_touch_gt911"

  esp_lcd_jd9365:
    version: "*"
    public: false
    override_path: "../../components/lcd/esp_lcd_jd9365"

  esp_lcd_ili9881c_waveshare:
    version: "*"
    public: false
    override_path: "../../components/lcd/esp_lcd_ili9881c_waveshare"

  esp_lcd_hx8394:
    version: "*"
    public: false
    override_path: "../../components/lcd/esp_lcd_hx8394"

  esp_lcd_dsi:
    version: "*"
    public: false
    override_path: "../../components/lcd/esp_lcd_dsi"

  usb:
    version: "^1.0.0"
    public: true
    rules:
      - if: "idf_version >=6.0"

examples:
  - path: ../../examples/display
  - path: ../../examples/display_lvgl_demos
  - path: ../../examples/display_sdcard
  - path: ../../examples/display_usb_hid
